version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: consulta-credito-postgres
    environment:
      POSTGRES_DB: consultacredito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - consulta-credito-network

  app:
    build: .
    container_name: consulta-credito-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/consultacredito
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - consulta-credito-network

volumes:
  postgres_data:

networks:
  consulta-credito-network:
    driver: bridge